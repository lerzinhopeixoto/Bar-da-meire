<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Bar da Meire — Cardápio & Pedidos</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#f5c518">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

  <meta name="apple-mobile-web-app-title"
        content="Bar da Meire">

  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <div class="logo-circle">
      <img
        src="img/icon-192.png"
        alt="Bar da Meire"
        style="
          width:46px;
          height:46px;
          border-radius:50%;
          object-fit:cover;
        "
      >
    </div>

    <div class="header-info">

      <h1>Bar da Meire</h1>

      <p>Rua Padre Samuel Fritz, 7A — São Paulo/SP</p>

      <span class="delivery-tag">

        <svg width="13"
             height="13"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>

        </svg>

        Entrega a partir de R$ 5,00

      </span>

    </div>

  </div>

  <!-- NAV -->
  <div class="nav">

    <button class="nav-btn active"
            onclick="showTab('cardapio')">

      <svg viewBox="0 0 24 24">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="2"/>
        <path d="M9 12h6M9 16h4"/>
      </svg>

      Cardápio

    </button>

    <button class="nav-btn"
            onclick="showTab('semana')">

      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>

      Semana

    </button>

    <button class="nav-btn"
            onclick="showTab('pedido')"
            id="btn-pedido">

      <svg viewBox="0 0 24 24">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>

      Pedido

      <span class="cart-badge" id="cbadge">
        0
      </span>

    </button>

  </div>

  <!-- CARDÁPIO -->
  <div class="section active" id="tab-cardapio">

    <div class="section-label">
      🍽️ Cardápio de hoje
    </div>

    <!-- EXEMPLO -->
    <div class="menu-card destaque"
         data-name="Peixe a Dorê"
         data-price="28.00"
         data-desc="Arroz, feijão, purê e salada">

      <h3>Peixe a Dorê</h3>

      <p>Arroz, feijão, purê e salada</p>

      <div class="card-row">

        <span class="price">
          R$ 28,00
        </span>

        <button class="add-btn"
                onclick="addItem(this)">

          + Adicionar

        </button>

      </div>

    </div>

    <!-- VOCÊ PODE MANTER TODOS OS OUTROS ITENS -->

  </div>

  <!-- SEMANA -->
  <div class="section" id="tab-semana">

    <div class="day-tabs">

      <button class="day-tab active"
              onclick="showDay('seg',this)">
        Segunda
      </button>

      <button class="day-tab"
              onclick="showDay('ter',this)">
        Terça
      </button>

      <button class="day-tab"
              onclick="showDay('qua',this)">
        Quarta
      </button>

      <button class="day-tab"
              onclick="showDay('qui',this)">
        Quinta
      </button>

      <button class="day-tab"
              onclick="showDay('sex',this)">
        Sexta
      </button>

      <button class="day-tab"
              onclick="showDay('sab',this)">
        Sábado
      </button>

    </div>

    <!-- CONTEÚDO DOS DIAS -->
    <!-- você pode manter os cards exatamente iguais -->

  </div>

  <!-- PEDIDO -->
  <div class="section" id="tab-pedido">

    <div id="pedido-content"></div>

  </div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- SCRIPT -->
<script src="script.js"></script>

<!-- SERVICE WORKER -->
<script>

  if ('serviceWorker' in navigator) {

    window.addEventListener('load', () => {

      navigator.serviceWorker
        .register('./sw.js')

        .then(() => {
          console.log('Service Worker registrado!');
        })

        .catch(err => {
          console.log('Erro no SW:', err);
        });

    });

  }

</script>

</body>
</html>
